<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Страница не найдена | SUP Club Astana</title>
<meta name="description" content="Эта волна ушла. Страница не найдена — вернитесь на главную SUP Club Astana.">
<style>
  :root{
    --sky-top:#7fd3f7;
    --sky-bottom:#e8f9ff;
    --deep:#0a4f7a;
    --water1:#1593c9;
    --water2:#0b78ad;
    --water3:#0a5f8d;
    --accent:#ff7a45;
    --ink:#06324d;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,#bfeaff 100%);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* Sun */
  .sun{
    position:absolute;top:8%;right:10%;
    width:clamp(70px,12vw,140px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff7c2,#ffd54a 60%,#ffb703);
    box-shadow:0 0 0 18px rgba(255,213,74,.25),0 0 0 42px rgba(255,213,74,.12);
    animation:pulse 6s ease-in-out infinite;
  }
  @keyframes pulse{50%{transform:scale(1.06)}}

  /* Clouds */
  .cloud{
    position:absolute;background:#fff;border-radius:100px;opacity:.9;
    filter:drop-shadow(0 6px 10px rgba(10,79,122,.08));
    animation:drift linear infinite;
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud.c1{top:14%;left:-20%;width:120px;height:34px;animation-duration:60s}
  .cloud.c1::before{width:50px;height:50px;top:-24px;left:18px}
  .cloud.c1::after{width:38px;height:38px;top:-16px;left:62px}
  .cloud.c2{top:26%;left:-30%;width:90px;height:26px;animation-duration:85s;animation-delay:-30s;opacity:.7}
  .cloud.c2::before{width:38px;height:38px;top:-18px;left:14px}
  .cloud.c2::after{width:28px;height:28px;top:-12px;left:46px}
  @keyframes drift{to{transform:translateX(160vw)}}

  /* Content */
  main{
    position:relative;z-index:5;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;
    padding:clamp(24px,6vh,64px) 20px 0;
  }
  .brand{
    display:inline-flex;align-items:center;gap:10px;
    font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;
    color:var(--deep);text-decoration:none;
    background:rgba(255,255,255,.65);backdrop-filter:blur(6px);
    padding:8px 16px;border-radius:999px;
  }
  .brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:block}

  .code{
    display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.5vw,16px);
    margin-top:clamp(18px,5vh,48px);
    font-weight:900;line-height:1;
    font-size:clamp(5.5rem,22vw,13rem);
    color:var(--deep);
    text-shadow:0 8px 0 rgba(255,255,255,.55);
  }
  .ring{
    width:.82em;height:.82em;display:block;
    animation:bob 4s ease-in-out infinite;
    filter:drop-shadow(0 10px 8px rgba(10,79,122,.25));
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-6deg)}
    50%{transform:translateY(-10px) rotate(6deg)}
  }

  h1{
    margin-top:clamp(8px,2vh,20px);
    font-size:clamp(1.5rem,4.5vw,2.6rem);
    font-weight:800;
  }
  p.lead{
    margin:12px auto 0;max-width:34em;
    font-size:clamp(1rem,2.2vw,1.2rem);
    line-height:1.55;color:#0b4566;
  }

  .actions{
    margin-top:clamp(20px,4vh,32px);
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 26px;border-radius:999px;
    font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer;
    border:2px solid transparent;font-family:inherit;
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .btn:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
  .btn.primary{
    background:var(--accent);color:#fff;
    box-shadow:0 10px 24px rgba(255,122,69,.4);
  }
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(255,122,69,.5)}
  .btn.ghost{
    background:rgba(255,255,255,.75);color:var(--deep);border-color:rgba(10,79,122,.25);
  }
  .btn.ghost:hover{background:#fff;transform:translateY(-2px)}

  .links{
    margin-top:22px;font-size:.95rem;color:#0b4566;
    display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;
  }
  .links a{color:var(--deep);font-weight:600;text-decoration:none;border-bottom:2px solid rgba(10,79,122,.25)}
  .links a:hover{border-color:var(--accent)}

  /* SUP rider */
  .rider-wrap{
    position:absolute;left:0;right:0;bottom:clamp(70px,13vh,150px);
    z-index:4;pointer-events:none;
  }
  .rider{
    width:clamp(150px,22vw,260px);
    position:absolute;left:-30%;
    animation:sail 22s linear infinite;
  }
  .rider svg{display:block;width:100%;height:auto;animation:sway 3s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes sail{to{left:105%}}
  @keyframes sway{
    0%,100%{transform:rotate(-2deg) translateY(0)}
    50%{transform:rotate(2deg) translateY(-4px)}
  }

  /* Waves */
  .waves{
    position:absolute;left:0;right:0;bottom:0;z-index:3;
    height:clamp(110px,26vh,260px);
    pointer-events:none;
  }
  .waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
  .w1{animation:wave 14s linear infinite}
  .w2{animation:wave 10s linear infinite reverse;opacity:.9}
  .w3{animation:wave 7s linear infinite}
  @keyframes wave{to{transform:translateX(-50%)}}

  footer{
    position:absolute;z-index:6;bottom:10px;left:0;right:0;text-align:center;
    font-size:.8rem;color:rgba(255,255,255,.85);
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
  @media (max-height:640px){
    .cloud,.sun{display:none}
  }
</style>
</head>
<body>

<div class="sun" aria-hidden="true"></div>

<div class="cloud c2" aria-hidden="true"></div>

<main>

  <div class="code" role="img" aria-label="Ошибка 404">

      <circle cx="100" cy="100" r="88" fill="#fff"/>

        <path d="M12 100a88 88 0 0 1 25.8-62.2L70 70a42 42 0 0 0-12 30z"/>
      </g>

      <circle cx="100" cy="100" r="42" fill="none" stroke="#0a4f7a" stroke-width="5"/>
    </svg>
    <span>4</span>
  </div>

  <h1>Упс, эта волна ушла</h1>
  <p class="lead">Страница, которую вы ищете, не найдена: возможно, её переместили или ссылка введена с ошибкой. Не переживайте — берите вёсла и возвращайтесь на берег.</p>

  <div class="actions">
    <a class="btn primary" href="/">🏄 На главную</a>
    <button class="btn ghost" type="button" onclick="if(history.length>1){history.back()}else{location.href='/'}">← Назад</button>
  </div>

  <nav class="links" aria-label="Полезные ссылки">
    <a href="/">Прокат SUP</a>
    <a href="/">Прогулки и туры</a>
    <a href="/">Контакты</a>
    <a href="https://instagram.com/sup.club.astana" target="_blank" rel="noopener">Instagram</a>
  </nav>
</main>

<!-- Paddleboarder -->

      <path d="M8 150 Q130 132 252 150 Q130 168 8 150Z" fill="#ff7a45"/>

      <!-- paddle -->
      <line x1="196" y1="40" x2="150" y2="158" stroke="#0a4f7a" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="146" cy="166" rx="7" ry="16" transform="rotate(22 146 166)" fill="#0a4f7a"/>
      <line x1="190" y1="38" x2="206" y2="44" stroke="#0a4f7a" stroke-width="5" stroke-linecap="round"/>

</div>

<div class="waves" aria-hidden="true">

<footer>© SUP Club Astana · Ошибка 404</footer>
