<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUP CLUB ASTANA — Сезон закрыт</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-yellow: #f59e0b;
            --accent-yellow-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --whatsapp-green: #22c55e;
            --whatsapp-hover: #16a34a;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            padding: 20px; 
            margin: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            max-width: 480px; 
            width: 100%;
            background: var(--bg-card); 
            padding: 40px 30px; 
            border-radius: 24px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            text-align: center;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        h2 { 
            color: var(--accent-yellow); 
            margin: 0 0 10px 0; 
            font-weight: 800; 
            letter-spacing: 0.5px; 
            font-size: 26px;
        }
        .subtitle {
            font-size: 20px;
            font-weight: 700;
            color: #ef4444;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 25px 0;
        }
        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn { 
            display: block; 
            width: 100%;
            box-sizing: border-box;
            padding: 16px; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: 800; 
            font-size: 15px; 
            text-transform: uppercase; 
            transition: background 0.2s, transform 0.2s;
        }
        .btn-insta { 
            background: var(--accent-yellow); 
            color: #0f172a; 
        }
        .btn-insta:hover { 
            background: var(--accent-yellow-hover); 
            transform: translateY(-2px);
        }
        .btn-wa { 
            background: var(--whatsapp-green); 
            color: #ffffff; 
        }
        .btn-wa:hover { 
            background: var(--whatsapp-hover); 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🏄‍♂️✨</div>
    <h2>SUP CLUB ASTANA</h2>
    <div class="subtitle">Сезон закрыт</div>
    <p>
        Спасибо, что были с нами в этом сезоне!<br>
        До встречи в следующем году.
    </p>
    
    <div class="buttons-group">
        <a href="https://www.instagram.com/sup.club.astana/?hl=ru" target="_blank" class="btn btn-insta">Мы в Instagram</a>
        <a href="https://wa.me/77479416498" target="_blank" class="btn btn-wa">Написать инструктору в WhatsApp</a>
    </div>
</div>

</body>
</html>
