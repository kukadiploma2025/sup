<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUP CLUB ASTANA — Проверка безопасности на воде</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 text-center">
    <h1 class="text-xl font-bold tracking-wide text-slate-400 mb-1">SUP CLUB ASTANA</h1>
    <h2 class="text-sm text-slate-500 mb-4">Проверка безопасности перед выплывом</h2>

    <!-- Плашка настоящей локации -->
    <div class="flex items-center justify-center gap-2 bg-slate-900/90 border border-slate-700 rounded-full py-1.5 px-4 mb-6 text-xs text-slate-300 w-fit mx-auto">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>Ваша локация: <strong id="location-name" class="text-cyan-400 font-semibold">Определяем...</strong></span>
    </div>

    <!-- Выбор даты и времени -->
    <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700 mb-6 text-left">
      <label class="block text-xs font-semibold text-slate-400 mb-2">Выберите дату и время прогулки:</label>
      <input type="datetime-local" id="datetime-picker" 
             class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 font-sans"
             onchange="checkSafety()">
    </div>

    <!-- Индикатор статуса -->
    <div id="status-card" class="p-6 rounded-2xl mb-6 transition-all border border-slate-700 bg-slate-700/50">
      <div id="status-icon" class="text-5xl mb-3">⏳</div>
      <div id="status-title" class="text-xl font-extrabold mb-2">Загрузка данных...</div>
      <p id="status-desc" class="text-sm text-slate-300">Получаем актуальные данные о погоде</p>
    </div>

    <!-- Метрики -->
    <div class="grid grid-cols-2 gap-3 mb-6 text-left">
      <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
        <div class="text-xs text-slate-400">Ветер / Порывы</div>
        <div id="wind-speed" class="text-lg font-bold mt-1">-- м/с</div>
      </div>
      <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
        <div class="text-xs text-slate-400">Погода</div>
        <div id="weather-condition" class="text-lg font-bold mt-1">--</div>
      </div>
    </div>

    <button onclick="checkSafety()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 active:scale-95 transition rounded-xl font-semibold text-sm">
      🔄 Пересчитать статус
    </button>
  </div>

  <script>
    const API_KEY = "bd5e378503939ddaee76f12ad7a97608";
    
    // Координаты по умолчанию (Астана)
    let currentLat = "51.16939";
    let currentLon = "71.44907";
    let cityName = "Астана";

    function initDateTimePicker() {
      const picker = document.getElementById('datetime-picker');
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      picker.value = now.toISOString().slice(0, 16);
    }

    // Запрос реальных координат пользователя (GPS)
    function detectLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLon = position.coords.longitude;
            checkSafety();
          },
          () => {
            // В случае отказа доступа берем Астану по умолчанию
            document.getElementById('location-name').innerText = `${cityName} (по умолчанию)`;
            checkSafety();
          }
        );
      } else {
        document.getElementById('location-name').innerText = `${cityName} (по умолчанию)`;
        checkSafety();
      }
    }

    async function checkSafety() {
      const pickerVal = document.getElementById('datetime-picker').value;
      if (!pickerVal) return;

      const selectedDate = new Date(pickerVal);
      const now = new Date();
      
      const title = document.getElementById('status-title');
      const windEl = document.getElementById('wind-speed');
      const weatherEl = document.getElementById('weather-condition');
      const locationEl = document.getElementById('location-name');

      title.innerText = "Загрузка...";

      try {
        let windSpeed = 0;
        let windGust = 0;
        let weatherMain = "";
        let weatherDesc = "";

        const diffInHours = (selectedDate - now) / (1000 * 60 * 60);

        if (Math.abs(diffInHours) < 1) {
          const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${currentLat}&lon=${currentLon}&appid=${API_KEY}&units=metric&lang=ru`);
          const data = await response.json();

          windSpeed = data.wind.speed;
          windGust = data.wind.gust || windSpeed;
          weatherMain = data.weather[0].main.toLowerCase();
          weatherDesc = data.weather[0].description;
          cityName = data.name || "Астана";
        } else {
          const response = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${currentLat}&lon=${currentLon}&appid=${API_KEY}&units=metric&lang=ru`);
          const data = await response.json();

          cityName = data.city.name || "Астана";
          const targetTimestamp = Math.floor(selectedDate.getTime() / 1000);
          
          let closestMatch = data.list[0];
          let minDiff = Math.abs(targetTimestamp - closestMatch.dt);

          for (const item of data.list) {
            const diff = Math.abs(targetTimestamp - item.dt);
            if (diff < minDiff) {
              minDiff = diff;
              closestMatch = item;
            }
          }

          windSpeed = closestMatch.wind.speed;
          windGust = closestMatch.wind.gust || windSpeed;
          weatherMain = closestMatch.weather[0].main.toLowerCase();
          weatherDesc = closestMatch.weather[0].description;
        }

        locationEl.innerText = cityName;
        windEl.innerText = `${Math.round(windSpeed)} м/с (порывы ${Math.round(windGust)})`;
        weatherEl.innerText = weatherDesc.charAt(0).toUpperCase() + weatherDesc.slice(1);

        // --- ЛОГИКА ПРАВИЛ ---
        const hours = selectedDate.getHours();

        // 1. Темное время суток (после 22:00 или до 06:00)
        if (hours >= 22 || hours < 6) {
          setStatus('red', '🌙', 'Темное время суток', `В ${hours}:00 выходить на воду не рекомендуется из соображений безопасности.`);
          return;
        }

        // 2. Гроза или шторм
        if (weatherMain.includes('thunderstorm') || weatherMain.includes('squall') || weatherMain.includes('tornado')) {
          setStatus('red', '⚡', 'Опасность! Гроза / Шторм', 'Прогнозируется гроза или опасные явления. Выход на воду запрещен!');
          return;
        }

        // 3. Сильный ветер (>8 м/с)
        if (windSpeed > 8 || windGust > 10) {
          setStatus('red', '💨', 'Опасно! Сильный ветер', `Ветер ${Math.round(windSpeed)} м/с с порывами до ${Math.round(windGust)} м/с. Выход запрещен.`);
          return;
        }

        // 4. Умеренный ветер (5–8 м/с)
        if (windSpeed >= 5 || windGust >= 7) {
          setStatus('yellow', '⚠️', 'Умеренный ветер', 'Выход возможен только для опытных райдеров. Гребите против ветра в начале пути.');
          return;
        }

        // 5. Отличные условия
        setStatus('green', '🏄‍♂️', 'Благоприятные условия!', 'Отличное время для катания на сапе. Обязательно надевайте спасательный жилет.');

      } catch (error) {
        setStatus('red', '❌', 'Ошибка данных', 'Не удалось получить данные о погоде на указанную дату.');
      }
    }

    function setStatus(type, iconEmoji, titleText, descText) {
      const card = document.getElementById('status-card');
      card.className = "p-6 rounded-2xl mb-6 transition-all border ";

      if (type === 'red') {
        card.classList.add('bg-rose-950/40', 'border-rose-500/50', 'text-rose-200');
      } else if (type === 'yellow') {
        card.classList.add('bg-amber-950/40', 'border-amber-500/50', 'text-amber-200');
      } else {
        card.classList.add('bg-emerald-950/40', 'border-emerald-500/50', 'text-emerald-200');
      }

      document.getElementById('status-icon').innerText = iconEmoji;
      document.getElementById('status-title').innerText = titleText;
      document.getElementById('status-desc').innerText = descText;
    }

    // Старт
    initDateTimePicker();
    detectLocation();
  </script>
</body>
</html>
